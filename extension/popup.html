<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Meet Notes Recorder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f1a;
      --card: #16162a;
      --border: #262640;
      --muted: #9a9aa8;
      --fg: #f4f4f7;
      --indigo: #6366f1;
      --cyan: #22d3ee;
      --danger: #dc2626;
    }
    body {
      margin: 0;
      width: 320px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 14px;
      font-weight: 600;
    }
    .body {
      padding: 16px;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .status-dot.recording {
      background: var(--danger);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .status-dot.busy {
      background: var(--cyan);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    button {
      width: 100%;
      padding: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #actionButton {
      background: var(--indigo);
      color: white;
    }
    #actionButton.recording {
      background: var(--danger);
    }
    #actionButton:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    #notesSection {
      margin-top: 4px;
    }
    #notesContent {
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.5;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .button-row {
      display: flex;
      gap: 8px;
    }
    .button-row button {
      flex: 1;
    }
    #copyButton, #resetButton {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--fg);
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="56" height="56" rx="14" fill="#0f0f1a"/>
      <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#6366f1" stroke-width="3.5"/>
      <circle cx="32" cy="32" r="12" fill="#22d3ee"/>
    </svg>
    <div class="title">Meet Notes Recorder</div>
  </div>

  <div class="body">
    <div class="status">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Checking meeting tab…</span>
    </div>

    <button id="actionButton" disabled>Start Recording Notes</button>

    <div id="notesSection" hidden>
      <div id="notesContent"></div>
      <div class="button-row">
        <button id="copyButton">Copy Notes</button>
        <button id="resetButton">New Recording</button>
      </div>
    </div>

    <button id="retryButton" hidden>Try Again</button>

    <div class="hint">
      Records this Meet tab's audio and video only. Nothing else on your
      screen is captured.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
